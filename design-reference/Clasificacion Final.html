<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clasificación Final — Arena Pentatlón · v2</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--pa-canvas);
    color: var(--pa-ink);
    font-family: var(--pa-font-body);
    min-height: 100vh;
    padding: 40px 24px 56px;
  }
  @media (max-width: 480px) { body { padding: 28px 16px 40px; } }

  .shell { max-width: 800px; margin: 0 auto; }

  /* ===== Header ===== */
  .head {
    margin-bottom: 56px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .eyebrow {
    margin: 0;
    font-family: var(--pa-font-body);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pa-ink-2);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 24px;
    height: 2px;
    background: var(--pa-accent);
    display: inline-block;
  }
  h1.title {
    margin: 0;
    font-family: var(--pa-font-display);
    font-weight: 700;
    font-size: clamp(40px, 7.5vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--pa-ink);
  }
  .meta {
    font-family: var(--pa-font-mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums lining-nums;
    color: var(--pa-ink-2);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .meta b { color: var(--pa-ink); font-weight: 700; }
  .meta .sep { color: var(--pa-ink-3); }

  /* ===== Desktop podium ===== */
  .podium {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 16px;
    align-items: end;
  }

  /* avatar floats above its step */
  .place {
    position: relative;
    padding-top: 88px;          /* room for the avatar overlap */
  }
  .avatar {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 128px;
    height: 128px;
    background: var(--pa-canvas-2);
    border: 1px solid var(--pa-hairline);
    border-radius: 0;
    overflow: hidden;
  }
  .place.first .avatar { border-color: var(--pa-ink); }
  .avatar svg { display: block; }

  /* the step itself — the medal colors live HERE as ranking data */
  .step {
    border-radius: 8px 8px 0 0;
    padding: 88px 16px 20px;      /* top room for avatar centered */
    text-align: center;
    color: var(--pa-ink);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  /* min-height keeps the stepped look but lets content size the step
     if it would otherwise overflow — never spills past the bottom. */
  .step.gold   { background: var(--pa-gold);   min-height: 240px; }
  .step.silver { background: var(--pa-silver); min-height: 200px; }
  .step.bronze { background: var(--pa-bronze); color: #fff; min-height: 180px; }

  .rank-num {
    font-family: var(--pa-font-mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    color: inherit;
    opacity: 0.85;
  }
  .step.gold .rank-num   { font-size: 18px; opacity: 1; }
  .step.silver .rank-num { font-size: 15px; }
  .step.bronze .rank-num { font-size: 15px; }

  .name {
    margin: 0;
    font-family: var(--pa-font-display);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .step.gold   .name { font-size: clamp(20px, 3.2vw, 26px); }
  .step.silver .name { font-size: clamp(16px, 2.4vw, 20px); }
  .step.bronze .name { font-size: clamp(16px, 2.4vw, 20px); }

  .pts {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
  }
  .pts .n {
    font-family: var(--pa-font-mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums lining-nums;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .pts .u {
    font-family: var(--pa-font-body);
    font-weight: 500;
    opacity: 0.75;
  }
  .step.gold   .pts .n { font-size: clamp(40px, 6vw, 52px); }
  .step.silver .pts .n,
  .step.bronze .pts .n { font-size: clamp(26px, 3.6vw, 32px); }
  .step.gold   .pts .u { font-size: 14px; }
  .step.silver .pts .u,
  .step.bronze .pts .u { font-size: 12px; }

  /* Winner-only accent flourish — the 5-bar logo motif, in accent */
  .winner-flag {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 16px;
  }
  .winner-flag i {
    display: block;
    width: 4px;
    background: var(--pa-accent);
  }
  .winner-flag i:nth-child(1) { height: 5px; }
  .winner-flag i:nth-child(2) { height: 8px; }
  .winner-flag i:nth-child(3) { height: 11px; }
  .winner-flag i:nth-child(4) { height: 14px; }
  .winner-flag i:nth-child(5) { height: 16px; }

  /* Medal pill — pill shape ONLY here */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: var(--pa-font-body);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
    align-self: center;
    background: rgba(22, 26, 51, 0.10);  /* knock-back of the underlying medal tone */
    color: var(--pa-ink);
    min-height: 22px;
  }
  .step.bronze .pill {
    background: rgba(255,255,255,0.16);
    color: #fff;
  }

  /* ===== Mobile stack ===== */
  @media (max-width: 640px) {
    .head { margin-bottom: 32px; gap: 10px; }
    h1.title { font-size: 44px; }
    .podium {
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .place { padding-top: 0; }
    .avatar {
      position: relative;
      left: 0;
      transform: none;
      width: 96px;
      height: 96px;
    }
    .step {
      border-radius: 8px;
      height: auto !important;
      padding: 16px;
      text-align: left;
      display: grid;
      grid-template-columns: 96px 1fr auto;
      grid-template-areas: "av meta pts";
      column-gap: 16px;
      row-gap: 6px;
      align-items: center;
    }
    .place .avatar { grid-area: av; }
    .step .stack-text {
      grid-area: meta;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      min-width: 0;
    }
    .step .pts {
      grid-area: pts;
      margin-top: 0;
      padding-top: 0;
      align-self: center;
    }
    .step.gold   .pts .n { font-size: 44px; }
    .step.silver .pts .n,
    .step.bronze .pts .n { font-size: 32px; }
    .pill { align-self: flex-start; }
    .winner-flag {
      top: 50%;
      left: -2px;
      transform: translateY(-50%) rotate(-90deg);
      transform-origin: left center;
    }
  }

  /* ===== Footer action ===== */
  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: center;
  }
  .btn-text {
    font-family: var(--pa-font-body);
    font-weight: 600;
    font-size: 14px;
    color: var(--pa-ink);
    background: transparent;
    border: 0;
    padding: 12px 18px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 5px;
    min-height: 44px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-text:hover { color: var(--pa-accent-strong); }
  .btn-text:focus-visible {
    outline: 2px solid var(--pa-accent);
    outline-offset: 2px;
    text-decoration: none;
  }
  .btn-text .arrow {
    font-family: var(--pa-font-mono);
    font-weight: 700;
    transition: transform 200ms cubic-bezier(.2,.8,.2,1);
  }
  .btn-text:hover .arrow { transform: translateX(2px); }
</style>
</head>
<body>
  <main class="shell">

    <header class="head">
      <p class="eyebrow">Pentatlón cerrado</p>
      <h1 class="title">Clasificación<br>final</h1>
      <div class="meta" aria-label="Resumen del pentatlón">
        <span><b>5</b> pruebas disputadas</span>
        <span class="sep">·</span>
        <span><b>3</b> héroes en el podio</span>
        <span class="sep">·</span>
        <span>22 / 16 / 9 pts</span>
      </div>
    </header>

    <section class="podium" aria-label="Podio final">

      <!-- ===== 2nd (left column on desktop) ===== -->
      <article class="place second" aria-label="Segundo puesto">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="128" height="128">
            <rect width="128" height="128" fill="#ECEEF2"/>
            <circle cx="64" cy="50" r="20" fill="#8B91A1"/>
            <path d="M24 116 C24 90, 104 90, 104 116 L104 128 L24 128 Z" fill="#8B91A1"/>
          </svg>
        </div>
        <div class="step silver">
          <div class="stack-text">
            <span class="rank-num">2°</span>
            <h2 class="name">La Sombra</h2>
            <span class="pill">Plata · 3 pts</span>
          </div>
          <div class="pts" aria-label="16 puntos">
            <span class="n">16</span>
            <span class="u">pts</span>
          </div>
        </div>
      </article>

      <!-- ===== 1st (center, tallest, accent flag) ===== -->
      <article class="place first" aria-label="Primer puesto">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="128" height="128">
            <rect width="128" height="128" fill="#ECEEF2"/>
            <circle cx="64" cy="50" r="20" fill="#8B91A1"/>
            <path d="M24 116 C24 90, 104 90, 104 116 L104 128 L24 128 Z" fill="#8B91A1"/>
          </svg>
        </div>
        <div class="winner-flag" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="step gold">
          <div class="stack-text">
            <span class="rank-num">1°</span>
            <h2 class="name">Capitán Fuerza</h2>
            <span class="pill">Oro · 5 pts</span>
          </div>
          <div class="pts" aria-label="22 puntos">
            <span class="n">22</span>
            <span class="u">pts</span>
          </div>
        </div>
      </article>

      <!-- ===== 3rd ===== -->
      <article class="place third" aria-label="Tercer puesto">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="128" height="128">
            <rect width="128" height="128" fill="#ECEEF2"/>
            <circle cx="64" cy="50" r="20" fill="#8B91A1"/>
            <path d="M24 116 C24 90, 104 90, 104 116 L104 128 L24 128 Z" fill="#8B91A1"/>
          </svg>
        </div>
        <div class="step bronze">
          <div class="stack-text">
            <span class="rank-num">3°</span>
            <h2 class="name">Byte Runner</h2>
            <span class="pill">Bronce · 1 pt</span>
          </div>
          <div class="pts" aria-label="9 puntos">
            <span class="n">9</span>
            <span class="u">pts</span>
          </div>
        </div>
      </article>

    </section>

    <div class="footer">
      <button type="button" class="btn-text">
        Simular de nuevo
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>

  </main>
</body>
</html>
